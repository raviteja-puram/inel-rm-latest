services:
  - type: web
    name: inel-rm
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PERSISTENCE_MODE
        value: postgres-sync
      - key: DATABASE_URL
        sync: false
